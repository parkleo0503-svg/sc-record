<script>
const LOCAL_MATCHES_KEY = "sc_matches_local_v1";
const CUSTOM_DB_KEY = "sc_custom_firebase_cfg_v1";
const ADMIN_PW_KEY = "sc_delete_pw_v2";

const BUILTIN_FIREBASE_CONFIG = {
  apiKey: "AIzaSyBNN0l2LbInlP69bAig1poS4mISSta4tE4",
  authDomain: "starecord.firebaseapp.com",
  projectId: "starecord",
  storageBucket: "starecord.firebasestorage.app",
  messagingSenderId: "137075151654",
  appId: "1:137075151654:web:17956a313f8b714b8f67e7"
};

let adminPassword = "0008";
try {
  const savedPw = localStorage.getItem(ADMIN_PW_KEY);
  if (savedPw && savedPw !== "1234") adminPassword = savedPw;
} catch (e) {}

let pendingProtectedAction = null;

let customDbConfig = BUILTIN_FIREBASE_CONFIG;
try {
  const savedCfg = localStorage.getItem(CUSTOM_DB_KEY);
  if (savedCfg) {
    const parsed = JSON.parse(savedCfg);
    if (parsed && parsed.apiKey && parsed.projectId) customDbConfig = parsed;
  }
} catch (e) {}

const defaultAppId = typeof __app_id !== "undefined" ? __app_id : "default-app-id";
const appId = customDbConfig ? "shared-fighting-spirit" : defaultAppId;
const activeConfig = customDbConfig || BUILTIN_FIREBASE_CONFIG;

let matches = [];
let pendings = [];
const BWREP_URL = (id) => "https://bwrep.com/t/p" + encodeURIComponent(id);
const bwrepLink = (m) => m.bwrep || (m.bwrepId ? BWREP_URL(m.bwrepId) : "");
let cloudBridge = {
  enabled: false,
  db: null,
  saveMatch: null,
  deleteMatch: null,
  batchSave: null,
  batchDelete: null,
  fetchAll: null,
  fetchPassword: null,
  savePassword: null
};

const P = [{ id: "L", n: "레오" }, { id: "G", n: "경섭" }, { id: "T", n: "태호" }];
const R = { Z: "저그", T: "테란", P: "프로토스" };
const B = {
  Z: ["럴커", "뮤탈", "목동"],
  T: ["바이오닉", "메카닉", "111"],
  P: ["질럿러시", "아비터", "캐리어", "선리버"]
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nm = (id) => {
  const found = P.find((p) => p.id === id);
  return found ? found.n : id;
};
const tKey = (m) => m.playedAt || m.createdAt || 0;
const cmp = (a, b) => (a.date > b.date ? 1 : a.date < b.date ? -1 : 0) || tKey(a) - tKey(b) || (a.seq || 0) - (b.seq || 0);
const hasB = (b) => b && b !== "-";
const rate = (w, l) => (w + l ? Math.round((w / (w + l)) * 100) + "%" : "-");
const pad = (n) => String(n).padStart(2, "0");
const fmt = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const shift = (s, n) => {
  const p = s.split("-");
  return fmt(new Date(+p[0], +p[1] - 1, +p[2] + n));
};
const valid = (m) => m && Array.isArray(m.players) && m.players.length === 2 && m.date && m.winner && m.id && (!m.status || m.status === "ok");
const isPending = (m) => m && m.status === "pending" && Array.isArray(m.players) && m.players.length === 2 && m.id;
// seq = order within a day by play time (kept in memory; auto records arrive later than they were played)
function renumber() {
  const c = {};
  matches.sort(cmp).forEach((m) => { c[m.date] = (c[m.date] || 0) + 1; m.seq = c[m.date]; });
}

function readSeed() {
  try {
    const a = JSON.parse(document.getElementById("seed").textContent || "[]");
    return Array.isArray(a) ? a.filter(valid) : [];
  } catch (e) {
    return [];
  }
}

function saveLocalMatches(list) {
  try {
    localStorage.setItem(LOCAL_MATCHES_KEY, JSON.stringify(list));
  } catch (e) {}
}

function loadLocalMatches() {
  try {
    const raw = localStorage.getItem(LOCAL_MATCHES_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed.filter(valid);
    }
  } catch (e) {}
  const seed = readSeed();
  saveLocalMatches(seed);
  return seed;
}

const PERIOD_LABEL_KEYS = ["today", "7", "30", "all"];
const S = {
  step: 1,
  date: fmt(new Date()),
  scope: "day",
  period: "all",
  tab: "h2h",
  showWiz: false,
  menu: false,
  sel: [],
  races: { L: "Z", G: "T", T: "P" },
  winner: null,
  builds: {},
  notes: {},
  edit: null,
  q: "",
  bp: "ALL"
};

function savePrefs() {
  try { localStorage.setItem("sc_prefs_v1", JSON.stringify({ period: S.period, tab: S.tab })); } catch (e) {}
}
try {
  const pf = JSON.parse(localStorage.getItem("sc_prefs_v1") || "null");
  if (pf) { if (PERIOD_LABEL_KEYS.indexOf(pf.period) > -1) S.period = pf.period; if (pf.tab) S.tab = pf.tab; }
} catch (e) {}
try {
  const s0 = JSON.parse(sessionStorage.getItem("sc_s") || "null");
  if (s0) Object.keys(s0).forEach((k) => { S[k] = s0[k]; });
} catch (e) {}

function updateLastRaces() {
  const r = { L: "Z", G: "T", T: "P" };
  matches.slice().sort(cmp).forEach((m) => {
    m.players.forEach((p) => {
      if (m.races && m.races[p]) r[p] = m.races[p];
    });
  });
  if (S.step === 1 && S.sel.length === 0) {
    S.races = r;

async function saveMatchToDB(matchObj) {

  if (idx > -1) matches[idx] = matchObj;
  else matches.push(matchObj);
  matches.sort(cmp);
  saveLocalMatches(matches);
  render();

  if (cloudBridge.enabled && cloudBridge.saveMatch) {
    try {
      await cloudBridge.saveMatch(matchObj);
      setSyncLabel("클라우드 저장됨 (" + matches.length + "경기)");
    } catch (e) {
      console.warn("Cloud save error:", e);
      toast("기기에 저장됨 (클라우드 규칙 확인 필요)");
    }
  } else {
    setSyncLabel("기기 저장 모드 (" + matches.length + "경기)");

}

async function deleteMatchFromDB(id) {
  const target = matches.find((x) => x.id === id);
  matches = matches.filter((x) => x.id !== id);

  render();

  if (cloudBridge.enabled && cloudBridge.deleteMatch) {

      } else {

async function reindexAndSyncDate(dateStr) {
  const dayMatches = matches.filter((m) => m.date === dateStr).sort(cmp);
  const updated = [];
  dayMatches.forEach((m, idx) => {
    if (m.seq !== idx + 1) {
      m.seq = idx + 1;
      updated.push(m);
    }
  });
  saveLocalMatches(matches);
  render();

  if (updated.length > 0 && cloudBridge.enabled && cloudBridge.batchSave) {
    try {
      await cloudBridge.batchSave(updated);
    } catch (e) {
      console.warn("Reindex cloud error:", e);
    }
  }
}

function stats(list) {
  const o = {};
  P.forEach((p) => { o[p.id] = { w: 0, l: 0, st: 0, f: [] }; });
  list.forEach((m) => {
    const a = m.players[0], b = m.players[1];
    if (!o[a] || !o[b]) return;
    const w = m.winner, l = loserOf(m);
    if (!o[w]) return;
    o[w].w++;
    o[w].st = o[w].st > 0 ? o[w].st + 1 : 1;
    o[w].f.push("W");
    o[l].l++;
    o[l].st = o[l].st < 0 ? o[l].st - 1 : -1;
    o[l].f.push("L");
  });
  return o;
}

}


// ---- Elo rating over ALL games (chronological). Start 1500, K=32.
const K_ELO = 32;
let ELO = { r: { L: 1500, G: 1500, T: 1500 }, hist: [], pd: {} };
function computeElo() {
  const r = { L: 1500, G: 1500, T: 1500 }, hist = [];
  matches.slice().sort(cmp).forEach((m) => {
    const w = m.winner, l = loserOf(m);
    if (!(w in r) || !(l in r)) return;
    const ew = 1 / (1 + Math.pow(10, (r[l] - r[w]) / 400));
    const d = Math.max(1, Math.round(K_ELO * (1 - ew)));
    m._ew = ew; m._d = d;
    r[w] += d; r[l] -= d;
    hist.push({ m: m, snap: { L: r.L, G: r.G, T: r.T } });
  });
  const from = periodStart(), pd = { L: 0, G: 0, T: 0 };
  hist.forEach((h) => {
    if (from && h.m.date < from) return;
    pd[h.m.winner] += h.m._d; pd[loserOf(h.m)] -= h.m._d;
  });
  ELO = { r: r, hist: hist, pd: pd };
}
const expect = (a, b) => 1 / (1 + Math.pow(10, (ELO.r[b] - ELO.r[a]) / 400));

// streak / record helpers over a chronological list
function streaks(list, pid) {
  let cur = 0, best = { n: 0 }, worst = { n: 0 }, start = null;
  list.forEach((m) => {
    if (m.players.indexOf(pid) < 0) return;
    const win = m.winner === pid;
    if (win) { if (cur > 0) cur++; else { cur = 1; start = m; } if (cur > best.n) best = { n: cur, from: start.date, to: m.date }; }
    else { if (cur < 0) cur--; else { cur = -1; start = m; } if (-cur > worst.n) worst = { n: -cur, from: start.date, to: m.date }; }
  });
  return { cur: cur, best: best, worst: worst };
}
function vsTable(list, pid) {
  const o = {};
  list.forEach((m) => {
    if (m.players.indexOf(pid) < 0) return;
    const op = m.players[0] === pid ? m.players[1] : m.players[0];
    o[op] = o[op] || [0, 0];
    m.winner === pid ? o[op][0]++ : o[op][1]++;
  });
  return o;
}
const range2 = (a, b) => (a === b ? md(a) : md(a) + "~" + md(b));

// achievements (all-time), borrowed from game badge systems
function achievements(pid) {
  const all = matches.slice().sort(cmp), mine = all.filter((m) => m.players.indexOf(pid) > -1);
  const wins = mine.filter((m) => m.winner === pid), st = streaks(all, pid);
  const perDay = {}, days = {}, racesWon = {};
  mine.forEach((m) => { days[m.date] = 1; if (m.winner === pid) { perDay[m.date] = (perDay[m.date] || 0) + 1; racesWon[raceOf(m, pid)] = 1; } });
  const maxDay = Math.max(0, ...Object.values(perDay));
  // revenge: a win right after losing 3+ in a row to the same opponent
  let revenge = false; const lossRun = {};
  mine.forEach((m) => {
    const op = m.players[0] === pid ? m.players[1] : m.players[0];
    if (m.winner === pid) { if ((lossRun[op] || 0) >= 3) revenge = true; lossRun[op] = 0; }
    else lossRun[op] = (lossRun[op] || 0) + 1;
  });
  const upset = wins.some((m) => m._ew != null && m._ew < 0.35);
  return [
    ["첫 승", "첫 승리", wins.length >= 1],
    ["10승", "누적 10승", wins.length >= 10],
    ["50승", "누적 50승", wins.length >= 50],
    ["100승", "누적 100승", wins.length >= 100],
    ["3연승", "3연승 달성", st.best.n >= 3],
    ["5연승", "5연승 달성", st.best.n >= 5],
    ["10연승", "10연승 달성", st.best.n >= 10],
    ["하루 5승", "하루에 5승", maxDay >= 5],
    ["복수", "3연패 당한 상대에게 승리", revenge],
    ["업셋", "예상 승률 35% 미만에서 승리", upset],
    ["올라운더", "세 종족으로 모두 승리", ["Z", "T", "P"].every((r) => racesWon[r])],
    ["개근", "5일 이상 출전", Object.keys(days).length >= 5]
  ];
}

// ---- SVG donut: segs [{v, c, t}] (c = null -> counted but not drawn; track shows through)
function donut(segs, o) {
  o = o || {};
  const size = o.size || 76, sw = o.sw || 9, r = (size - sw) / 2, C = 2 * Math.PI * r, cx = size / 2;
  const total = segs.reduce((a, x) => a + x.v, 0);
  const drawn = segs.filter((x) => x.v > 0 && x.c);
  const gap = drawn.length > 1 ? 2 : 0;
  let off = 0, arcs = "";
  segs.forEach((x) => {
    if (!total || x.v <= 0) return;
    const len = (x.v / total) * C;
    if (x.c) {
      const dash = Math.max(len - gap, 0.8);
      arcs += '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" style="stroke:' + x.c + '" stroke-width="' + sw +
        '" stroke-dasharray="' + dash.toFixed(2) + " " + (C - dash).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) +
        '" transform="rotate(-90 ' + cx + " " + cx + ')">' + (x.t ? "<title>" + esc(x.t) + "</title>" : "") + "</circle>";
    }
    off += len;
  });
  return (
    '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + " " + size + '" role="img" aria-label="' + esc(o.label || "") + '" style="flex:none">' +
    '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" style="stroke:var(--p2)" stroke-width="' + sw + '"/>' + arcs +
    (o.center != null ? '<text x="50%" y="' + (o.sub ? "47%" : "50%") + '" text-anchor="middle" dominant-baseline="central" style="fill:var(--tx);font-weight:900;font-size:' + (o.fs || 16) + 'px">' + esc(o.center) + "</text>" : "") +
    (o.sub ? '<text x="50%" y="67%" text-anchor="middle" dominant-baseline="central" style="fill:var(--mu);font-size:10px;font-weight:700">' + esc(o.sub) + "</text>" : "") +
    "</svg>"
  );
}

function tabRace() {
  const l = scoped();
  if (!l.length) return noGames();
  const mu = {}, pr = {};
  P.forEach((p) => { pr[p.id] = { Z: [0, 0], T: [0, 0], P: [0, 0] }; });
  l.forEach((m) => {
    const w = m.winner, lo = loserOf(m), wr = raceOf(m, w), lr = raceOf(m, lo);
    if (pr[w] && pr[w][wr]) pr[w][wr][0]++;
    if (pr[lo] && pr[lo][lr]) pr[lo][lr][1]++;
    if (!R[wr] || !R[lr]) return;
    const k = [wr, lr].sort(), key = k[0] + " vs " + k[1];
    mu[key] = mu[key] || { g: 0, a: 0, b: 0, k: k };
    mu[key].g++;
    if (wr !== lr) { wr === k[0] ? mu[key].a++ : mu[key].b++; }
  });
  const cards = P.map((p) => {
    const x = pr[p.id], tot = ["Z", "T", "P"].reduce((a, r) => a + x[r][0] + x[r][1], 0);

      '<div class="chart">' +
      donut(["Z", "T", "P"].map((r) => ({ v: x[r][0] + x[r][1], c: RC[r], t: R[r] + " " + (x[r][0] + x[r][1]) + "판" })), { center: tot ? String(tot) : "-", sub: tot ? "판" : "", label: p.n + " 종족 사용" }) +

      }).join("") +

  }).join("");
  const mk = Object.keys(mu).sort((a, b) => mu[b].g - mu[a].g);
  return (
    '<div class="g3x">' + cards + "</div>" +
    '<div class="card"><h2>종족 상성</h2>' +

      ? '<div class="tw"><table><tr><th>매치업</th><th>경기</th><th>결과</th></tr>' +

        }).join("") +
        "</table></div>"

    "</div>"
  );
}

function drawRating() {
  const svg = $("#rsvg"), fig = $("#rfig"), tip = $("#rtip");
  if (!svg || !fig) return;
  const from = periodStart();
  let pts = ELO.hist.filter((h) => !from || h.m.date >= from);
  const prev = ELO.hist[ELO.hist.indexOf(pts[0]) - 1];
  const base = { snap: prev ? prev.snap : { L: 1500, G: 1500, T: 1500 }, m: null };
  pts = [base].concat(pts);
  const W = fig.clientWidth, H = fig.clientHeight, padL = 38, padR = 46, padT = 10, padB = 22;
  let lo = Infinity, hi = -Infinity;
  pts.forEach((h) => P.forEach((p) => { lo = Math.min(lo, h.snap[p.id]); hi = Math.max(hi, h.snap[p.id]); }));
  lo = Math.floor((lo - 10) / 25) * 25; hi = Math.ceil((hi + 10) / 25) * 25;
  const n = pts.length - 1 || 1;
  const X = (i) => padL + ((W - padL - padR) * i) / n, Y = (v) => padT + ((H - padT - padB) * (hi - v)) / (hi - lo);
  let g = "";
  const stepV = Math.max(25, Math.ceil((hi - lo) / 4 / 25) * 25);
  hi = lo + Math.ceil((hi - lo) / stepV) * stepV;
  for (let v = lo; v <= hi; v += stepV) {
    const y = Y(v);
    g += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y + '" y2="' + y + '" style="stroke:var(--ln);stroke-width:1;opacity:' + (v === 1500 ? 0.9 : 0.45) + '"' + (v === 1500 ? ' stroke-dasharray="3 3"' : "") + "/>" +
      '<text x="' + (padL - 6) + '" y="' + y + '" text-anchor="end" dominant-baseline="central" style="fill:var(--mu);font-size:10px">' + v + "</text>";
  }
  // date ticks at day boundaries (thinned to fit)
  let lastD = "", ticks = [];
  pts.forEach((h, i) => { if (h.m && h.m.date !== lastD) { ticks.push([i, h.m.date]); lastD = h.m.date; } });
  const every = Math.max(1, Math.ceil(ticks.length / Math.max(2, Math.floor((W - padL - padR) / 52))));
  ticks.forEach((t, k) => { if (k % every === 0) g += '<text x="' + X(t[0]) + '" y="' + (H - 6) + '" text-anchor="middle" style="fill:var(--mu);font-size:10px">' + md(t[1]) + "</text>"; });
  const ends = [];
  P.forEach((p) => {
    const d = pts.map((h, i) => (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(h.snap[p.id]).toFixed(1)).join(" ");
    g += '<path d="' + d + '" fill="none" style="stroke:' + PC[p.id] + ';stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>';
    ends.push({ p: p, y: Y(pts[pts.length - 1].snap[p.id]) });
  });
  // direct end labels, nudged apart so they never overlap
  ends.sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 13) ends[k].y = ends[k - 1].y + 13;
  ends.forEach((e) => { g += '<text x="' + (W - padR + 6) + '" y="' + e.y + '" dominant-baseline="central" style="fill:var(--tx);font-size:11px;font-weight:800">' + e.p.n + "</text>"; });
  g += '<line id="rx" y1="' + padT + '" y2="' + (H - padB) + '" style="stroke:var(--mu);stroke-width:1;display:none"/>';
  P.forEach((p) => { g += '<circle id="rd' + p.id + '" r="4" style="fill:' + PC[p.id] + ';stroke:var(--pn);stroke-width:2;display:none"/>'; });
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.innerHTML = g;
  const move = (ev) => {
    const box = svg.getBoundingClientRect(), x = ev.clientX - box.left;
    const i = Math.max(0, Math.min(pts.length - 1, Math.round(((x - padL) / (W - padL - padR)) * n)));
    const h = pts[i], xx = X(i), rx = $("#rx");
    rx.setAttribute("x1", xx); rx.setAttribute("x2", xx); rx.style.display = "";
    P.forEach((p) => { const c = $("#rd" + p.id); c.setAttribute("cx", xx); c.setAttribute("cy", Y(h.snap[p.id])); c.style.display = ""; });
    const head = h.m ? md(h.m.date) + " · " + nm(h.m.winner) + " 승 vs " + nm(loserOf(h.m)) + " (±" + h.m._d + ")" : "시작";
    tip.innerHTML = "<b>" + esc(head) + "</b><br>" + P.slice().sort((a, b) => h.snap[b.id] - h.snap[a.id]).map((p) => sw(PC[p.id]) + " " + p.n + " " + h.snap[p.id]).join("<br>");
    tip.style.display = "block";
    const tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(4, xx + 10 + tw > W ? xx - tw - 10 : xx + 10), W - tw - 4) + "px";
    tip.style.top = "8px";
  };
  const leave = () => { tip.style.display = "none"; const rx = $("#rx"); if (rx) rx.style.display = "none"; P.forEach((p) => { const c = $("#rd" + p.id); if (c) c.style.display = "none"; }); };
  svg.onpointermove = move; svg.onpointerdown = move; svg.onpointerleave = leave;
}

function tabRecords() {
  const l = scoped();
  if (!l.length) return noGames();
  const card = (k, v, sub) => '<div class="h2h"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="m">' + sub + "</div></div>";
  const cards = [];
  // longest win / loss streaks
  let bw = null, bl = null;
  P.forEach((p) => { const s0 = streaks(l, p.id); if (!bw || s0.best.n > bw.n) bw = Object.assign({ p: p }, s0.best); if (!bl || s0.worst.n > bl.n) bl = Object.assign({ p: p }, s0.worst); });
  if (bw && bw.n) cards.push(card("최장 연승", sw(PC[bw.p.id]) + " " + bw.p.n + " " + bw.n + "연승", range2(bw.from, bw.to)));
  if (bl && bl.n) cards.push(card("최장 연패", sw(PC[bl.p.id]) + " " + bl.p.n + " " + bl.n + "연패", range2(bl.from, bl.to)));
  // most wins in a day / busiest day
  const dw = {}, dn = {};
  l.forEach((m) => { const k = m.date + "|" + m.winner; dw[k] = (dw[k] || 0) + 1; dn[m.date] = (dn[m.date] || 0) + 1; });
  const tw = Object.keys(dw).sort((a, b) => dw[b] - dw[a])[0];
  if (tw) { const t = tw.split("|"); cards.push(card("하루 최다승", sw(PC[t[1]]) + " " + nm(t[1]) + " " + dw[tw] + "승", md(t[0]))); }
  const bd = Object.keys(dn).sort((a, b) => dn[b] - dn[a])[0];
  if (bd) cards.push(card("최다 경기일", dn[bd] + "경기", md(bd)));
  // biggest upset
  const up = l.filter((m) => m._ew != null).sort((a, b) => a._ew - b._ew)[0];
  if (up && up._ew < 0.5) cards.push(card("최대 업셋", sw(PC[up.winner]) + " " + nm(up.winner) + " → " + nm(loserOf(up)), md(up.date) + " · 예상 승률 " + Math.round(up._ew * 100) + "%에서 승리"));
  // current hot streak
  let hot = null;
  P.forEach((p) => { const s0 = streaks(l, p.id); if (s0.cur > 1 && (!hot || s0.cur > hot.n)) hot = { p: p, n: s0.cur }; });
  if (hot) cards.push(card("지금 가장 뜨거운", sw(PC[hot.p.id]) + " " + hot.p.n, hot.n + "연승 진행 중"));
  // nemesis / favourite opponent (min 3 games)
  const nem = P.map((p) => {
    const t = vsTable(l, p.id), ks = Object.keys(t).filter((k) => t[k][0] + t[k][1] >= 3);
    if (!ks.length) return "";
    const r0 = (k) => t[k][0] / (t[k][0] + t[k][1]);
    const worst = ks.sort((a, b) => r0(a) - r0(b))[0], best = ks[ks.length - 1];
    if (r0(worst) >= 0.5) return "";
    return '<div class="lg"><span>' + sw(PC[p.id]) + "<b>" + p.n + "</b></span><span>천적 " + nm(worst) + ' <span class="m">' + t[worst][0] + "승 " + t[worst][1] + "패</span>" +
      (best !== worst && r0(best) > 0.5 ? " · 먹잇감 " + nm(best) + ' <span class="m">' + t[best][0] + "승 " + t[best][1] + "패</span>" : "") + "</span></div>";
  }).join("");
  return (
    '<div class="rec">' + cards.join("") + "</div>" +
    (nem ? '<div class="card"><h2>천적 · 먹잇감</h2><p class="m" style="margin-bottom:6px">3판 이상 붙은 상대 중 승률이 가장 낮은/높은 상대</p>' + nem + "</div>" : "")
  );
}

function renderTab() {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.v === S.tab));
  const f = { list: tabList, h2h: tabH2H, race: tabRace, daily: tabDaily, rating: tabRating, records: tabRecords }[S.tab] || tabH2H;
  $("#tab").innerHTML = f();
  if (rObs) { rObs.disconnect(); rObs = null; }
  if (S.tab === "rating" && $("#rfig")) {
    drawRating();

  if (ds) ds.scrollLeft = ds.scrollWidth;   // newest day visible first
}

function hm(t) {
  if (!t) return "";
  const d = new Date(t);
  return pad(d.getMonth() + 1) + "." + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function summary() {
  const l = scoped(), s = stats(l), t = ["[투혼 1:1 전적 · " + PERIOD_LABEL[S.period] + " " + l.length + "경기]"];
  P.forEach((p) => {
    const x = s[p.id];
    t.push(p.n + ": " + x.w + "승 " + x.l + "패 (" + rate(x.w, x.l) + ")" + (x.st > 1 ? " " + x.st + "연승 중" : x.st < -1 ? " " + -x.st + "연패 중" : ""));
  });
  if (l.length && S.period === "today") {
    t.push("");
    l.forEach((m) => {
      const w = m.winner, lo = loserOf(m);
      t.push(md(m.date) + " " + nm(w) + "(" + raceOf(m, w) + ") 승 vs " + nm(lo) + "(" + raceOf(m, lo) + ")");
    });
  }
  return t.join("\n");
}

async function refreshFromCloud(showToast = false) {
  if (cloudBridge.enabled && cloudBridge.fetchPassword) {
    try {
      const remotePw = await cloudBridge.fetchPassword();
      if (remotePw && remotePw !== "1234") {
        adminPassword = String(remotePw);
        try { localStorage.setItem(ADMIN_PW_KEY, adminPassword); } catch (e) {}
      }
    } catch (e) {}
  }
  if (cloudBridge.enabled && cloudBridge.fetchAll) {
    try {
      setSyncLabel("불러오는 중…");
      const list = await cloudBridge.fetchAll();
      if (Array.isArray(list)) {
        pendings = list.filter(isPending);
        matches = list.filter(valid).sort(cmp);
        saveLocalMatches(matches);
        updateLastRaces();
        setSyncLabel("클라우드 연결됨 (" + matches.length + "경기)");
        render();
        if (showToast) toast("최신 전적을 불러왔습니다.");
        return;
      }
    } catch (e) {
      console.warn("Cloud fetch failed:", e);
    }
  }
  matches = loadLocalMatches().sort(cmp);
  updateLastRaces();
  setSyncLabel("기기 저장 모드 (" + matches.length + "경기)");
  render();
  if (showToast) toast("기기 저장소에서 불러왔습니다.");
}

const ACT = {
  refreshData: () => refreshFromCloud(true),
  openDbConfig: () => { S.menu = false; render(); openDbConfigModal(); },
  saveDbConfig: () => {
    const raw = ($("#dbConfigInput") && $("#dbConfigInput").value.trim()) || "";
    try {
      const parsed = JSON.parse(raw);
      if (!parsed || !parsed.apiKey || !parsed.projectId) throw 0;
      localStorage.setItem(CUSTOM_DB_KEY, JSON.stringify(parsed));
      toast("설정을 저장했습니다. 페이지를 새로고침합니다.");
      setTimeout(() => location.reload(), 600);
    } catch (e) {
      toast("올바른 JSON 형식이 아닙니다. apiKey와 projectId를 확인하세요.");
    }
  },
  resetDbConfig: () => {
    localStorage.removeItem(CUSTOM_DB_KEY);
    toast("기본 starecord DB 설정으로 복원합니다.");
    setTimeout(() => location.reload(), 600);
  },
  pick: (v) => {
    const i = S.sel.indexOf(v);
    if (i > -1) S.sel.splice(i, 1);
    else {
      if (S.sel.length >= 2) S.sel.shift();
      S.sel.push(v);
    }
    S.winner = null;
    S.step = S.sel.length === 2 ? 2 : 1;
    render();
  },
  race: (v, p) => {
    S.races[p] = v;
    render();
  },
  step: (v) => {
    S.step = +v;
    if (+v < 3) S.winner = null;
    render();
  },
  again: () => {
    const m = day().slice(-1)[0];
    if (!m) return;
    S.sel = m.players.slice();
    S.sel.forEach((p) => { S.races[p] = raceOf(m, p); });
    S.winner = null;
    S.step = 3;
    render();
  },
  pendWin: async (v, p) => {
    const m = pendings.find((x) => x.id === v);
    if (!m || m.players.indexOf(p) < 0) return;
    pendings = pendings.filter((x) => x.id !== v);
    const done = Object.assign({}, m, { winner: p, status: "ok", resolvedAt: Date.now() });
    delete done.reason;
    await saveMatchToDB(done);
    toast(nm(p) + " 승으로 기록했어요");
  },
  pendDrop: async (v) => {
    const m = pendings.find((x) => x.id === v);
    if (!m) return;
    pendings = pendings.filter((x) => x.id !== v);
    render();
    if (cloudBridge.enabled && cloudBridge.saveMatch) {
      try { await cloudBridge.saveMatch(Object.assign({}, m, { status: "dismissed", dismissedAt: Date.now() })); } catch (e) { console.warn(e); }
    }
    toast("기록하지 않기로 했어요");
  },
  win: (v) => {
    S.winner = v;
    render();
  },
  save: async () => {
    if (!S.winner || S.sel.length !== 2) return;
    const a = S.sel[0], b = S.sel[1];
    const nextSeq = day().length + 1;
    const m = {
      id: "m_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
      date: S.date,
      seq: nextSeq,
      createdAt: Date.now(),
      map: "투혼",
      players: [a, b],
      winner: S.winner,
      races: {},
      builds: {},
      notes: {}
    };
    [a, b].forEach((p) => {
      m.races[p] = S.races[p];
      m.builds[p] = "-";
      m.notes[p] = "";
    });
    S.winner = null;
    S.sel = [];
    S.step = 1;
    S.showWiz = false;
    await saveMatchToDB(m);
    toast(m.date + " 경기를 추가했어요");
  },
  tab: (v) => {
    S.tab = v;
    savePrefs();
    renderTab();
    const b = document.querySelector('#tabs [data-v="' + v + '"]');
    if (b && b.scrollIntoView) b.scrollIntoView({ block: "nearest", inline: "nearest" });
  },
  scope: (v) => {
    S.scope = v;
    render();
  },
  period: (v) => {
    S.period = v;
    savePrefs();
    render();
  },
  player: (v) => openPlayer(v),
  fp: (v) => { S.fp = v; S.fo = ""; renderTab(); },
  fo: (v) => { S.fo = v; renderTab(); },
  menu: () => {
    S.menu = !S.menu;
    const b = document.querySelector('[data-a="menu"]');
    if (b) b.setAttribute("aria-expanded", String(S.menu));
    render();
  },
  toggleWiz: () => {
    S.showWiz = !S.showWiz;
    S.menu = false;
    render();
    if (S.showWiz && $("#wizWrap")) $("#wizWrap").scrollIntoView({ block: "start", behavior: "smooth" });
  },
  prev: () => {
    S.date = shift(S.date, -1);
    S.sel = [];
    render();
  },
  next: () => {
    S.date = shift(S.date, 1);
    S.sel = [];
    render();
  },
  today: () => {
    S.date = fmt(new Date());
    render();
  },
  edit: (v) => openEdit(v),
  openChangePwModal: openChangePwModal,
  confirmProtected: async () => {
    const val = ($("#delPwInput") && $("#delPwInput").value.trim()) || "";
    if (val !== adminPassword) {
      toast("비밀번호가 일치하지 않습니다.");
      const inp = $("#delPwInput");
      if (inp) { inp.value = ""; inp.focus(); }
      return;
    }
    const fn = pendingProtectedAction;
    closeModal();
    if (fn) await fn();
  },
  submitChangePw: async () => {
    const cur = ($("#curPwInput") && $("#curPwInput").value.trim()) || "";
    const p1 = ($("#newPwInput") && $("#newPwInput").value.trim()) || "";
    const p2 = ($("#newPwConfirm") && $("#newPwConfirm").value.trim()) || "";
    if (cur !== adminPassword) {
      toast("현재 비밀번호가 일치하지 않습니다.");
      return;
    }
    if (!p1) {
      toast("새 비밀번호를 입력해 주세요.");
      return;
    }
    if (p1 !== p2) {
      toast("새 비밀번호 확인이 일치하지 않습니다.");
      return;
    }
    adminPassword = p1;
    try { localStorage.setItem(ADMIN_PW_KEY, p1); } catch (e) {}
    if (cloudBridge.enabled && cloudBridge.savePassword) {
      try {
        await cloudBridge.savePassword(p1);
      } catch (e) {
        console.warn("Cloud pw save error:", e);
      }
    }
    closeModal();
    toast("비밀번호가 변경되었습니다.");
  },
  del: (v) => {
    const m = matches.find((x) => x.id === v);
    if (!m) return;
    requestProtectedAction(
      "경기 삭제 확인",
      md(m.date) + " " + nm(m.players[0]) + " vs " + nm(m.players[1]) + " 기록을 삭제하려면 비밀번호를 입력하세요.",
      async () => {
        const backupMatch = JSON.parse(JSON.stringify(m));
        await deleteMatchFromDB(v);
        await reindexAndSyncDate(backupMatch.date);
        toast("경기를 삭제했어요", async () => {
          await saveMatchToDB(backupMatch);
          await reindexAndSyncDate(backupMatch.date);
        });
      }
    );
  },
  clearDay: () => {
    const rm = day();
    if (!rm.length) {
      toast("지울 기록이 없어요");
      return;
    }
    requestProtectedAction(
      "이 날짜 초기화 확인",
      S.date + "의 모든 경기 기록(" + rm.length + "경기)을 삭제하려면 비밀번호를 입력하세요.",
      async () => {
        const backupList = JSON.parse(JSON.stringify(rm));
        const rmIds = {};
        rm.forEach((m) => { rmIds[m.id] = 1; });
        matches = matches.filter((m) => !rmIds[m.id]);
        saveLocalMatches(matches);
        render();

        if (cloudBridge.enabled && cloudBridge.batchDelete) {
          try {
            await cloudBridge.batchDelete(rm.map((m) => m.id));
            setSyncLabel("클라우드 저장됨 (" + matches.length + "경기)");
          } catch (e) {
            console.warn("Clear day cloud error:", e);
          }
        } else {
          setSyncLabel("기기 저장 모드 (" + matches.length + "경기)");
        }

        toast(S.date + " 기록 " + rm.length + "경기를 지웠어요", async () => {
          matches = matches.concat(backupList).sort(cmp);
          saveLocalMatches(matches);
          render();
          if (cloudBridge.enabled && cloudBridge.batchSave) {
            try {
              await cloudBridge.batchSave(backupList);
            } catch (e) {}
          }
        });
      }
    );
  },
  undo: () => {
    if (undoFn) {
      undoFn();
      undoFn = null;
      $("#toast").classList.remove("open");
    }
  },
  kakao: () => {
    S.menu = false; render();
    const t = summary();
    panel("카톡 공유용 전적", t, false);
    const ta = $("#ptxt");
    if (ta) {
      ta.select();
      ACT.copy();
    }
  },
  backup: () => {
    S.menu = false; render();
    const restoreBtn = '<button type="button" class="btn" data-a="restore">붙여넣은 내용으로 복원</button>';
    const desc = '<p class="m" style="margin:-4px 0 12px 4px">백업 JSON 데이터를 복사해 보관하거나, 붙여넣은 뒤 복원하면 기존 기록에 합쳐집니다.</p>';
    panel("백업 · 복원", JSON.stringify(matches), true, restoreBtn);
    $("#panel").insertAdjacentHTML("beforeend", desc);
  },
  restore: async () => {
    try {
      const a = JSON.parse($("#ptxt").value);
      if (!Array.isArray(a)) throw 0;
      const ids = {};
      matches.forEach((m) => { ids[m.id] = 1; });
      const add = a.filter((m) => valid(m) && !ids[m.id]);
      if (!add.length) {
        toast("새로 추가할 기록이 없습니다.");
        return;
      }
      matches = matches.concat(add).sort(cmp);
      const datesToReindex = {};
      add.forEach((m) => { datesToReindex[m.date] = 1; });

      Object.keys(datesToReindex).forEach((d) => {
        matches.filter((m) => m.date === d).sort(cmp).forEach((m, i) => { m.seq = i + 1; });
      });

      saveLocalMatches(matches);
      render();

      if (cloudBridge.enabled && cloudBridge.batchSave) {
        try {
          const toSync = matches.filter((m) => add.some((x) => x.id === m.id) || datesToReindex[m.date]);
          await cloudBridge.batchSave(toSync);
        } catch (e) {
          console.warn("Restore cloud error:", e);
        }
      }
      toast("새 기록 " + add.length + "경기를 합쳤어요");
    } catch (e) {
      toast("복원할 수 없는 형식이에요. 백업 내용을 통째로 붙여넣어 주세요.");
    }
  },
  copy: () => {
    const ta = $("#ptxt");
    if (!ta) return;
    ta.focus();
    ta.select();
    try {
      document.execCommand("copy") ? toast("복사했어요") : toast("선택된 내용을 직접 복사해 주세요");
    } catch (e) {
      toast("선택된 내용을 직접 복사해 주세요");
    }
  },
  closePanel: () => { $("#panel").innerHTML = ""; },
  closeModal: closeModal,
  saveEdit: async () => {
    const m = matches.find((x) => x.id === S.edit);
    if (!m) { closeModal(); return; }
    const a = m.players[0], b = m.players[1];
    m.winner = $("#ew").value;
    m.races = m.races || {};
    m.builds = m.builds || {};
    m.notes = m.notes || {};
    [[a, "a"], [b, "b"]].forEach((x) => {
      m.races[x[0]] = $("#er" + x[1]).value;
      m.builds[x[0]] = $("#eb" + x[1]).value.trim() || "-";
      m.notes[x[0]] = $("#en" + x[1]).value.trim();
    });
    closeModal();
    await saveMatchToDB(m);
    toast("수정했어요");
  }
};

function handleActionEvent(e) {
  const t = e.target.closest("[data-a]");
  if (!t) return;
  const action = t.dataset.a;
  if (ACT[action]) {
    ACT[action](t.dataset.v, t.dataset.p);
  }
}

document.addEventListener("click", handleActionEvent);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#modal").classList.contains("open")) closeModal();
  const t = e.target.closest && e.target.closest('[role="button"][data-a]');
  if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); handleActionEvent(e); }
});

const dateEl = $("#date");
if (dateEl) {
  dateEl.addEventListener("change", (e) => {
    if (e.target.value) {
      S.date = e.target.value;
      S.sel = [];
      render();
    }
  });
}

matches = loadLocalMatches().sort(cmp);
updateLastRaces();
setSyncLabel("기기 저장 모드 (" + matches.length + "경기)");
render();

// live: new auto records show up without refreshing
function applyLive(list, local) {
  if (local || !Array.isArray(list)) return;
  const known = {};
  matches.forEach((m) => { known[m.id] = 1; });
  pendings.forEach((m) => { known[m.id] = 1; });
  const nextM = list.filter(valid), nextP = list.filter(isPending);
  const fresh = nextM.filter((m) => !known[m.id]), freshP = nextP.filter((m) => !known[m.id]);
  matches = nextM.sort(cmp);
  pendings = nextP;
  saveLocalMatches(matches);
  setSyncLabel("실시간 연결됨 (" + matches.length + "경기)");
  if ($("#modal").classList.contains("open")) return;   // don't redraw under an open dialog
  render();
  if (fresh.length === 1) toast("새 경기: " + nm(fresh[0].winner) + " 승 vs " + nm(loserOf(fresh[0])));
  else if (fresh.length > 1) toast("새 경기 " + fresh.length + "개가 들어왔어요");
  if (freshP.length) setTimeout(() => toast("확인 필요한 경기가 " + freshP.length + "개 있어요"), fresh.length ? 3000 : 0);
}

window.__scBridgeReady = async function (bridge) {
  cloudBridge = Object.assign(cloudBridge, bridge);
  await refreshFromCloud(false);
  if (cloudBridge.subscribe) {
    let first = true;
    cloudBridge.subscribe((list, local) => {
      if (first) { first = false; return; }   // initial snapshot = what refreshFromCloud already loaded
      applyLive(list, local);
    });
  }
};
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, deleteDoc, collection, writeBatch, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

try {
  const app = initializeApp(activeConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  try {
    await signInAnonymously(auth);
  } catch (authErr) {
    console.warn("Anonymous sign-in skipped:", authErr);
  }

  const matchesColRef = () => collection(db, "artifacts", appId, "public", "data", "matches");
  const matchDocRef = (id) => doc(db, "artifacts", appId, "public", "data", "matches", id);
  const configDocRef = () => doc(db, "artifacts", appId, "public", "data", "settings", "deleteLock");

  const fetchPassword = async () => {
    const snap = await getDoc(configDocRef());
    if (snap.exists() && snap.data().password) {
      return String(snap.data().password);
    }
    return null;
  };

  const savePassword = async (pw) => {
    await setDoc(configDocRef(), { password: String(pw), updatedAt: Date.now() }, { merge: true });
  };

  const fetchAll = async () => {
    const snapshot = await getDocs(matchesColRef());
    const list = [];
    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      if (valid(data) || isPending(data)) list.push(data);
    });
    return list;
  };

  const saveMatch = async (matchObj) => {
    await setDoc(matchDocRef(matchObj.id), matchObj);
  };

  const deleteMatch = async (id) => {
    await deleteDoc(matchDocRef(id));
  };

  const batchSave = async (list) => {
    const batch = writeBatch(db);
    list.forEach((m) => batch.set(matchDocRef(m.id), m));
    await batch.commit();
  };

  const batchDelete = async (ids) => {
    const batch = writeBatch(db);
    ids.forEach((id) => batch.delete(matchDocRef(id)));
    await batch.commit();
  };

  const subscribe = (cb) => onSnapshot(matchesColRef(), (snap) => {
    const list = [];
    snap.forEach((d) => list.push(d.data()));
    cb(list, snap.metadata ? snap.metadata.hasPendingWrites : false);
  }, (err) => console.warn("live updates off:", err));

  if (window.__scBridgeReady) {
    await window.__scBridgeReady({
      enabled: true,
      subscribe,
      db,
      fetchAll,
      saveMatch,
      deleteMatch,
      batchSave,
      batchDelete,
      fetchPassword,
      savePassword
    });
  }
} catch (err) {
  console.warn("Firebase module unavailable, keeping local mode:", err);
}
</script>
